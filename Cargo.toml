[workspace]
members = ["crates/core", "crates/shmem", "crates/locale", "crates/path"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/qlib-rs/qlib-rs"

[workspace.dependencies]
arrow-array = { version = "59.2.0", default-features = false, features = ["chrono-tz"] }
arrow-buffer = { version = "=59.2.0", default-features = false }
arrow-data = { version = "=59.2.0", default-features = false }
arrow-arith = { version = "59.2.0", default-features = false }
arrow-cast = { version = "59.2.0", default-features = false }
arrow-ipc = { version = "59.2.0", default-features = false }
arrow-ord = { version = "59.2.0", default-features = false }
arrow-select = { version = "59.2.0", default-features = false }
arrow-schema = { version = "59.2.0", default-features = false }
bincode = "1.3.3"
byteorder = { version = "=1.5.0", default-features = false }
cc = { version = "=1.4.4", default-features = false }
libloading = { version = "=0.8.9", default-features = false }
bytes = "1.12.1"
candle-core = { version = "=0.9.1", default-features = false }
candle-nn = { version = "=0.9.1", default-features = false }
candle-optimisers = { version = "=0.9.0", default-features = false }
safetensors = "=0.4.5"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
csv = { version = "1.4.0", default-features = false }
encoding_rs = { version = "=0.8.35", default-features = false, features = ["alloc"] }
half = { version = "2.7.1", default-features = false, features = ["std"] }
indicatif = { version = "0.18.6", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
indexmap = { version = "=2.14.0", default-features = false, features = ["serde", "std"] }
intl = { version = "=0.2.0", default-features = false, features = ["full"] }
icu_casemap = { version = "=2.0.0", default-features = false, features = ["compiled_data"] }
icu_locale_core = { version = "=2.1.1", default-features = false }
lru = "0.18.3"
memmap2 = "0.9.11"
ndarray = { version = "0.17.2", default-features = false, features = ["serde", "std"] }
num-bigint = { version = "0.5.1", features = ["serde"] }
num-traits = "0.2.19"
num-complex = { version = "=0.4.6", default-features = false, features = ["std"] }
pyformat-rs = "=0.1.0"
rustpython-format = { version = "=0.4.0", default-features = false, features = ["num-bigint"] }
rustpython-literal = "=0.4.0"
regex = { version = "1.13.1", default-features = false, features = ["perf", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.20"
thousands = "=0.2.0"
widestring = "=1.2.1"
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Environment", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemServices", "Wdk_Storage_FileSystem"] }
tempfile = "3.23.0"
tokio = { version = "1.53.1", default-features = false, features = ["io-util", "macros", "process", "rt", "time"] }
tokio-util = { version = "0.7.19", default-features = false, features = ["codec"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
crc32fast = "1.5.0"
crossbeam-channel = "0.5.16"
rand = { version = "=0.9.2", default-features = false, features = ["std", "std_rng", "os_rng", "thread_rng"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
