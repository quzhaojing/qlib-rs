[package]
name = "checkpoint-model-probe"
version = "0.0.0"
edition = "2024"
publish = false

# Candidate evaluation only: this does not select a production ML runtime.
[workspace]

[features]
default = ["current"]
current = ["dep:candle-current"]
msrv-candidate = ["dep:candle-msrv"]
production = ["msrv-candidate", "dep:domain-core", "dep:indexmap", "dep:safetensors-wire"]

[dependencies]
candle-current = { package = "candle-core", version = "=0.11.0", default-features = false, optional = true }
candle-msrv = { package = "candle-core", version = "=0.9.1", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
domain-core = { package = "core", path = "../../crates/core", optional = true }
indexmap = { version = "=2.14.0", optional = true }
safetensors-wire = { package = "safetensors", version = "=0.4.5", optional = true }

[lints.rust]
unsafe_code = "forbid"
